<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JPhotography Portfolio</title>
    
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #fafafa;
            position: relative; 
            padding: 20px;
        }

        .font-heading {
            font-family: 'Playfair Display', serif;
            color: #000000;
        }

        .gallery-img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 8px;
            transition: transform 0.3s ease;
        }

        .gallery-img:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .filter-btn {
            border-radius: 30px;
            padding: 8px 30px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .tracking-widest {
            letter-spacing: 0.25em;
        }

        .camera-corner {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 12px solid #1a1a1a;
            z-index: 100;
            pointer-events: none;
        }

        .top-left {
            top: 20px;
            left: 20px;
            border-bottom: none;
            border-right: none;
        }

        .top-right {
            top: 20px;
            right: 20px;
            border-bottom: none;
            border-left: none;
        }

        .bottom-left {
            bottom: 20px;
            left: 20px;
            border-top: none;
            border-right: none;
        }

        .bottom-right {
            bottom: 20px;
            right: 20px;
            border-top: none;
            border-left: none;
        }
    </style>
</head>
<body>
    <div class="camera-corner top-left"></div>
    <div class="camera-corner top-right"></div>
    <div class="camera-corner bottom-left"></div>
    <div class="camera-corner bottom-right"></div>
