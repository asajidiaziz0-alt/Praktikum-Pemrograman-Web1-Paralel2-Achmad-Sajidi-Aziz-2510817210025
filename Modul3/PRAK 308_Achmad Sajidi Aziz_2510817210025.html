<html>
<head>
    <title>Pendaftaran Kursus</title>
</head>
<body bgcolor="#dcdcdc">
<table border="1" align="center" width="700" cellpadding="5" cellspacing="2">
    <tr bgcolor="#87CEEB">
        <td align="center" height="80">
            <font size="6" color="red">
            <b>Pendaftaran Kursus</b>
            </font>
        </td>
    </tr>
    <tr bgcolor="gray">
        <td>
        <font size="6"><b>Data Diri</b></font>
        <br><br>
        <form>
        <table cellpadding="5">
            <tr>
                <td>Nama</td>
                <td>
                <input type="text" size="25">
                </td>
            </tr>
            <tr>
                <td>Nim</td>
                <td>
                <input type="text" size="25">
                </td>
            </tr>
            <tr>
                <td>E-mail</td>
                <td>
                <input type="email" size="25">
                </td>
            </tr>
            <tr>
                <td>Tanggal Lahir</td>
                <td>
                <input type="text" value="hh/bb/tttt" size="20">
                </td>
            </tr>
            <tr>
                <td valign="top">Jenis Kelamin</td>
                <td>
                <input type="radio" name="jk"> Laki-laki
                <br>
                <input type="radio" name="jk"> Perempuan
                </td>
            </tr>
            <tr>
                <td valign="top">Pilih Program Kursus</td>
                <td>
                <input type="checkbox"> C#
                <br>
                <input type="checkbox"> Java
                <br>
                <input type="checkbox"> SQL
                <br>
                <input type="checkbox"> HTML dan PHP
                </td>
            </tr>
            <tr>
                <td>Pilihan Hari/Jam Kursus</td>
                <td>
                <select>
                <option>Senin - Rabu / 09.00 - 11.00</option>
                <option>Selasa - Kamis / 13.00 - 15.00</option>
                <option>Jumat - Sabtu / 08.00 - 10.00</option>
                </select>
                </td>
            </tr>
            </table>
            <br><br>
            <tr bgcolor="salmon">
                <td>
                Komentar Anda
                <br><br>
                <textarea rows="6" cols="55"></textarea>
                <br><br>
                <input type="reset" value="Reset">
                <input type="submit" value="Submit">
                <input type="button" value="Cancel">
                </td>
            </tr>
        </table>
        </form>
        </td>
    </tr>
</table>
</body>
</html>
